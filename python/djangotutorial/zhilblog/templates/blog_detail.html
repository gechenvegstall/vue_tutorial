{% extends 'base.html' %}


{% block title%}博客文章详情{% endblock %}

{% block main %}
<h1>{{blog.title}}</h1>
    <hr>
    <div class="mt-2">
        <img src="{% static 'image/avatar.webp' %}" alt="" height="30" width="30" class="rounded-circle" >
        <span class="mt-2">{{blog.author.username}}</span>
        <span class="mt-2">于</span>
        <span class="mt-2">{{blog.pub_time|date:"Y年m月d日 h时i分"}}</span>发布
    </div>
    <hr>
    <div class="py-2">
        {{blog.content|safe}}
    </div>
    <hr>
    <div class="mt-2">
        <h3>评论</h3>
        <form action="" method="post">
            <div class="mt-2">
                <input type="text" class="form-control" placeholder="请输入评论">
            </div>
            <div class="text-end mt-2">
                <button type="button" class="btn btn-primary">评论</button>
            </div>
        </form>
    </div>
    <div class="mt-2">
        <ul class="list-group list-group-flush">
            <li class="list-group-item mb-3">
                <div class="d-flex justify-content-between" >
                    <div class="user-info">
                        <img src="{% static 'image/avatar.webp' %}" alt="" height="30" width="30" class="rounded-circle" >
                        <span>xxx</span>
                    </div>
                    <div class="create-time" style="line-height:30px" >2020.2.2 11：22</div>
                </div>
                <div class="mt-2">
                    这是评论内容
                </div>
            </li>
            <li class="list-group-item mb-3">
                <div class="d-flex justify-content-between">
                    <div class="user-info">
                        <img src="{% static 'image/avatar.webp' %}" alt="" height="30" width="30"
                             class="rounded-circle">
                        <span>xxx</span>
                    </div>
                    <div class="create-time" style="line-height:30px">2020.2.2 1122</div>
                </div>
                <div class="mt-2">
                    这是评论内容
                </div>
            </li>
        </ul>
    </div>
{% endblock %}
