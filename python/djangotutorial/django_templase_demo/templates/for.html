<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>for标签</title>
</head>
<body>
 {% for user in users  %}
    <p>{{ user.name }}</p>
    <p>{{ user.password }}</p>
{% endfor %}
<!-- 字典-->
 {% for key,value in dict.items  %}
<p>{{ key }}:{{value}}</p>
{% endfor %}
</body>
</html>
